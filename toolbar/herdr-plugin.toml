id = "jefelabs.toolbar"
name = "Toolbar"
version = "0.1.3"
min_herdr_version = "0.9.0"
description = "Right-hand activity bar of tools, each hosted in its own terminal"
platforms = ["macos", "linux"]

# Runs on `herdr plugin install` only; a linked checkout is built by hand:
#   cargo build --release -p herdr-toolbar
# The workspace puts the binary in <repo>/target, one level above this plugin.
[[build]]
command = ["cargo", "build", "--release", "-p", "herdr-toolbar"]

[[panes]]
id = "toolbar"
title = "Toolbar"
placement = "split"
command = ["../target/release/herdr-toolbar"]

[[actions]]
id = "toggle"
title = "Toolbar: toggle"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "toggle"]

[[actions]]
id = "focus"
title = "Toolbar: focus in / out"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "focus"]

# Herdr actions take no arguments: one action per slot, bindable from any pane.
[[actions]]
id = "select-1"
title = "Toolbar: tool 1"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "select", "1"]

[[actions]]
id = "select-2"
title = "Toolbar: tool 2"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "select", "2"]

[[actions]]
id = "select-3"
title = "Toolbar: tool 3"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "select", "3"]

[[actions]]
id = "select-4"
title = "Toolbar: tool 4"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "select", "4"]

[[actions]]
id = "select-5"
title = "Toolbar: tool 5"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "select", "5"]

[[actions]]
id = "trust"
title = "Toolbar: trust this workspace's .herdr-toolbar.toml"
contexts = ["workspace"]
command = ["../target/release/herdr-toolbar", "trust"]
