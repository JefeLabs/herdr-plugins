[package]
name = "herdr-toolbar"
version = "0.8.0"
description = "Herdr plugin: a right-hand activity bar of tools, each hosted in its own terminal"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
anyhow = "1"
shellexpand = "3"
nix = { version = "0.31", features = ["signal"] }
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
toml = "1"
