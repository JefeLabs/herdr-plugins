# herdr-toolbar tools. Copy to the path printed by `herdr plugin config-dir jefelabs.toolbar`
# as tools.toml. A worktree may add `.herdr-toolbar.toml` at its root with the same schema;
# its entries replace global ones with the same id, and its `order`, if present, wins.

prefix = "ctrl-]"
order  = ["issues", "capabilities", "db", "files", "jira", "browser"]

[[tool]]
id      = "issues"
name    = "GitHub issues"
icon    = "◉"
command = ["gh", "dash"]

[[tool]]
id      = "capabilities"
name    = "Capabilities"
icon    = "✎"
command = ["/absolute/path/to/herdr-plugins/target/release/herdr-capabilities"]

[[tool]]
id      = "db"
name    = "Database"
icon    = "▤"
command = ["lazysql"]
cwd     = "~"

[[tool]]
id      = "files"
name    = "Files"
icon    = "▭"
command = ["yazi"]

[[tool]]
id      = "jira"
name    = "Jira"
icon    = "◆"
command = ["jira", "issue", "list"]
env     = { JIRA_PROJECT = "SKOOL" }

# Opens in a Herdr pane beside the work pane, at full size and speed;
# selecting it again closes that pane.
[[tool]]
id      = "browser"
name    = "Browser"
icon    = "◎"
command = ["terminal-browser", "open"]
open    = "pane"

# A pane tool can open several panes, stacked top to bottom: one command per
# pane in `panes`, in place of `command`. Selecting it again closes them all.
