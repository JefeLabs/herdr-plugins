# herdr-toolbar tools. The installer writes tools.toml for you through its
# walk-through (run it again with --setup to choose again); this example is for
# setting it up by hand. Copy it to the path printed by
# `herdr plugin config-dir jefelabs.toolbar` as tools.toml. A worktree may add
# `.herdr-toolbar.toml` at its root with the same schema; its entries replace
# global ones with the same id, and its `order`, if present, wins.
#
# The icons here are plain text. Nerd Font icons (Ghostty and kitty ship
# them) are listed in toolbar/setup/tools.

prefix = "ctrl-]"
bar    = "large"   # bigger buttons: five columns by two rows (or "small")
# Tells tools where they are: {meta}, {db}, {agent} (see the README).
context = ["/absolute/path/to/herdr-plugins/target/release/herdr-intents", "context"]
# The bar's groups go top to bottom: space, agent, system, with a rule between
# them; `order` sorts within each group (see the README).
order  = ["intents", "browser", "issues", "db", "files", "editor", "terminal", "usage"]

[[tool]]
id      = "intents"
name    = "Intents"
icon    = "✎"
group   = "space"
command = ["/absolute/path/to/herdr-plugins/target/release/herdr-intents"]

[[tool]]
id      = "issues"
name    = "GitHub issues"
icon    = "◉"
group   = "space"
command = ["gh", "dash"]

[[tool]]
id      = "db"
name    = "Database"
icon    = "▤"
group   = "agent"
# the active agent's database, when the space's run guide says how to find it
command = ["lazysql", "{db?}"]
cwd     = "~"

[[tool]]
id      = "files"
name    = "Files"
icon    = "▭"
group   = "agent"
command = ["yazi"]

# Jira: lists issues from the project `jira init` set up. Add "jira" to
# `order` to use it.
# [[tool]]
# id      = "jira"
# name    = "Jira"
# icon    = "◆"
# command = ["jira", "issue", "list"]

# Neovim in a pane, listening on a socket named after the workspace, so a file
# can be opened in it from outside:
#   nvim --server "$HOME/.cache/nvim-editor-<workspace id>.sock" --remote <file>
[[tool]]
id      = "editor"
name    = "Editor"
icon    = "◫"
group   = "agent"
command = ["sh", "-c", "d=${XDG_CACHE_HOME:-$HOME/.cache}; mkdir -p \"$d\"; s=\"$d/nvim-editor-${HERDR_WORKSPACE_ID:-local}.sock\"; rm -f \"$s\"; exec nvim --listen \"$s\""]
# another agent becomes active: Neovim stays open and changes its folder
on_switch = ["sh", "-c", "nvim --server \"${XDG_CACHE_HOME:-$HOME/.cache}/nvim-editor-${HERDR_WORKSPACE_ID:-local}.sock\" --remote-send '<C-\\><C-n>:cd {agent}<CR>'"]

# Opens in a Herdr pane beside the work pane, at full size and speed;
# selecting it again closes that pane.
[[tool]]
id      = "browser"
name    = "Browser"
icon    = "◎"
group   = "space"
command = ["terminal-browser", "open", "{browse?}"]   # the space's page (run guide `browse:`)
open    = "pane"

# Experimental: the browser inside the toolbar's slot. Add "web" to `order`.
# [[tool]]
# id       = "web"
# name     = "Browser (in the toolbar)"
# icon     = "◍"
# command  = ["terminal-browser", "open"]
# graphics = true

# A pane tool can open several panes, stacked top to bottom: one command per
# pane in `panes`, in place of `command`. Selecting it again closes them all.
# On Linux, use "containerd" in place of "Virtualization".
[[tool]]
id    = "usage"
name  = "Usage"
icon  = "▤"
group   = "system"
open  = "pane"
panes = [
  ["procs", "--watch-interval", "2", "--sortd", "cpu", "--insert", "ReadBytes", "--insert", "WriteBytes",
   "--or", "herdr", "docker", "Virtualization"],
  ["oxker"],
  ["dua", "i", "."],
]

# A shell in the toolbar, never beside the agent's chat, in the active agent's
# worktree. Another agent becoming active keeps the shell; the next one starts
# in the new worktree.
[[tool]]
id      = "terminal"
name    = "Terminal"
icon    = "▣"
group   = "agent"
command = ["sh", "-c", "exec \"${SHELL:-/bin/sh}\""]
on_switch = "keep"   # another agent becoming active keeps the shell
