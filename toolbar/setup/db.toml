# LazySql on the active agent's database, when the space's run guide says how
# to find it (Intents' context: `db:`); otherwise its own connection list. It
# restarts on the new database when another agent becomes active (an agent
# tool's default on_switch, restart). It is off the bar in a space whose
# space.toml says `database = false` (Intents' context: `database`).
[[tool]]
id      = "db"
name    = "Database"
icon    = "@ICON@"
group   = "agent"
when    = "database"
command = ["lazysql", "{db?}"]
cwd     = "~"
