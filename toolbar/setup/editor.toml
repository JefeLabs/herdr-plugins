# Neovim in the toolbar, in the active agent's worktree, with documents: an
# agent's `herdr-doc open <file>` shows the file formatted (Markdown, JSON,
# CSV, images…), `v` edits it in this Neovim and `:Doc` goes back. It listens
# on a socket named after the workspace, so files can be opened in it from
# outside: nvim --server "$HOME/.cache/nvim-editor-<workspace id>.sock" --remote <file>
[[tool]]
id      = "editor"
name    = "Editor"
icon    = "@ICON@"
group   = "agent"
command = ["@DOC@"]
# another agent becomes active: Neovim stays open and changes its folder. The
# folder goes in as an argument ("$1"), never inside the script, and reaches
# Neovim as a quoted string (chdir), never as a command line.
on_switch = ["sh", "-c", "p=$(printf %s \"$1\" | sed \"s/'/''/g\"); exec nvim --server \"${XDG_CACHE_HOME:-$HOME/.cache}/nvim-editor-${HERDR_WORKSPACE_ID:-local}.sock\" --remote-expr \"chdir('$p')\" >/dev/null", "sh", "{agent}"]
