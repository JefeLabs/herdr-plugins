# Neovim in a new Herdr pane beside the work pane, in the workspace folder;
# selecting it again closes that pane. It listens on a socket named after the
# workspace, so files can be opened in it from outside:
#   nvim --server "$HOME/.cache/nvim-editor-<workspace id>.sock" --remote <file>
[[tool]]
id      = "editor"
name    = "Editor"
icon    = "@ICON@"
command = ["sh", "-c", "d=${XDG_CACHE_HOME:-$HOME/.cache}; mkdir -p \"$d\"; s=\"$d/nvim-editor-${HERDR_WORKSPACE_ID:-local}.sock\"; rm -f \"$s\"; exec nvim --listen \"$s\""]
open    = "pane"
