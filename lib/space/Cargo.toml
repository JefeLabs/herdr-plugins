[package]
name = "herdr-space"
version = "0.11.2"
description = "The space files shared by the Herdr plugins: a space's meta repo, its repos, and each person's pointers"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
shellexpand = "3"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
