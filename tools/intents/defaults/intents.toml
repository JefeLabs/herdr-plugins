# herdr-intents configuration. Edit freely; built-in providers and handoffs
# below can be overridden by redefining them with the same name.

root = "~/.helmsmith/intents/spaces"
editor = "$EDITOR"
polish_provider = "agy"        # agy | claude | codex | copilot | <custom>
send_provider = "claude"       # fallback for handoffs that name no provider
# workbrokr = true             # force on/off; default detects helmsmith.config.ts

# claude polishes with `--strict-mcp-config` (no MCP servers), left off
# automatically when your organization manages MCP servers on this machine
# (claude refuses the flag then). Force it either way:
# [providers.claude]
# strict_mcp = false

# Custom provider example:
# [providers.mine]
# polish = ["my-cli", "--prompt", "{prompt}"]
# resume = ["my-cli", "--resume", "{conv}", "--prompt", "{prompt}"]
# output = "text"              # or "jsonl" with text_path/id_path/done_type
# send_kind = "claude"         # `herdr agent start --kind` when sending via this provider

# Handoff example:
# [[handoff]]
# name = "triage"
# kinds = ["issue"]
# provider = "claude"
# prompt = "Triage this:\n\n{intent}"
