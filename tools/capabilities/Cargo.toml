[package]
name = "herdr-capabilities"
version = "0.1.3"
description = "Herdr plugin: capture, refine (with an agent) and send capabilities to agents"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_yaml_ng = "0.10"
serde_json = "1"
slug = "0.1"
similar = "3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
shellexpand = "3"
nix = { version = "0.31", features = ["signal", "process"] }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
insta = "1"
tempfile = "3"
